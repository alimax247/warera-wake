# Knocks the public site every 5 minutes so Render free does not spin it down.
# This repo is public on purpose: scheduled workflows on a free private repo never ran.
name: wake

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the server
        run: |
          set -u
          code=$(curl -sS -o /tmp/wake.txt -w "%{http_code}" --max-time 90 "https://warera-bot-y8ia.onrender.com/api/cron/production?wake=1" || echo "000")
          echo "wake:$code"
          head -c 200 /tmp/wake.txt || true
          echo
          if [ "$code" != "200" ]; then
            curl -sS -o /dev/null -w "home:%{http_code}\n" --max-time 90 "https://warera-bot-y8ia.onrender.com/" || true
            exit 1
          fi
